version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: timetable-postgres
    environment:
      POSTGRES_DB: timetable_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: timetable-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: timetable-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/timetable_db
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-your-super-secret-access-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      PORT: 3000
      NODE_ENV: development
      API_PREFIX: /api
      PYTHON_SERVICE_URL: http://optimizer:8000
      PYTHON_SERVICE_API_KEY: ${PYTHON_SERVICE_API_KEY:-internal-service-key-change-in-production}
      CORS_ORIGIN: http://localhost:5173
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      MAX_FILE_SIZE: 10485760
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    volumes:
      - ../src:/app/src
      - ../prisma:/app/prisma

  optimizer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: timetable-optimizer
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/timetable_db
      PYTHON_SERVICE_API_KEY: ${PYTHON_SERVICE_API_KEY:-internal-service-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../optimization:/app/optimization

volumes:
  postgres_data: