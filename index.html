<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ExamFlow — Exam Operations</title>
<style>
:root{
 --bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;
 --brand:#2563eb;--brand-dark:#1d4ed8;--nav:#0b1220;--nav2:#172238;
 --green:#16a34a;--amber:#d97706;--red:#dc2626;--blue:#0ea5e9;
 --shadow:0 10px 30px rgba(15,23,42,.06);--radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:250px;background:var(--nav);color:#dbeafe;padding:18px 13px 92px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:7px 10px 24px;font-size:20px;font-weight:800}.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#38bdf8,#2563eb);color:white}
.nav-section{margin:18px 12px 7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#61708a}.nav{display:grid;gap:4px}.nav button{width:100%;border:0;background:transparent;color:#9fb0c8;padding:10px 12px;border-radius:9px;display:flex;gap:11px;align-items:center;text-align:left}.nav button:hover,.nav button.active{background:var(--nav2);color:white}
.sidebar-bottom{position:absolute;left:13px;right:13px;bottom:12px;border-top:1px solid #243047;padding-top:10px;background:var(--nav);z-index:2}
.main{margin-left:250px;min-width:0}.topbar{position:sticky;top:0;z-index:10;height:66px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}.topbar-left{font-weight:750}.topbar-right{display:flex;gap:9px;align-items:center}.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:white;border-radius:9px;display:grid;place-items:center;color:#334155}.avatar{width:36px;height:36px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:800}
.content{padding:26px;max-width:1540px;margin:0 auto;min-width:0}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.page-head h1{font-size:26px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:9px 13px;font-weight:700;display:inline-flex;align-items:center;gap:8px}.btn:hover{box-shadow:0 4px 14px rgba(15,23,42,.08)}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.primary:hover{background:var(--brand-dark)}.btn.danger{color:var(--red)}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}.card-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.card-head h3{margin:0;font-size:15px}.card-body{padding:17px}.stat{padding:17px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:700}.stat h2{font-size:27px;margin:10px 0 4px}.small{font-size:12px;color:var(--muted)}
.dashboard-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dashboard-lower{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.chart{height:230px;display:flex;align-items:flex-end;gap:12px;padding:15px 4px 4px;min-width:0;overflow-x:auto}.bar{flex:1;min-width:20px;background:#bfdbfe;border-radius:7px 7px 3px 3px;position:relative}.bar strong{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:#475569}.bar-label{text-align:center;font-size:10px;color:var(--muted);margin-top:6px}.timeline{display:grid;gap:11px}.timeline-row{display:grid;grid-template-columns:65px 10px minmax(0,1fr);gap:10px;align-items:center}.timeline-row .time{text-align:right;font-size:11px;color:var(--muted)}.dot{width:9px;height:9px;background:var(--brand);border-radius:50%}.exam-item{border:1px solid var(--line);padding:10px 11px;border-radius:9px;min-width:0}.exam-item strong{font-size:13px}.exam-meta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 11px;min-width:160px}.field.search{min-width:250px}.table-wrap{overflow:auto;max-width:100%}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.table th{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#fafafa}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.amber{background:#fef3c7;color:#92400e}.blue{background:#e0f2fe;color:#075985}.purple{background:#ede9fe;color:#5b21b6}
.wizard{display:grid;grid-template-columns:205px minmax(0,1fr);gap:16px}.steps{padding:14px}.step{display:flex;gap:9px;padding:11px 8px;border-radius:8px;color:var(--muted)}.step.active{background:#e0f2fe;color:#075985;font-weight:750}.step-num{width:24px;height:24px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:10px;flex:none}.step.done .step-num{background:var(--green);border-color:var(--green);color:white}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-group label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:white}.form-group.full{grid-column:1/-1}.wizard-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:15px;border-top:1px solid var(--line)}
/* Critical seat-layout fix: both columns are min-width:0 and the grid cannot force the page wider. */
.seat-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,330px);gap:16px;align-items:start;min-width:0}.room-stage{min-width:0;overflow:hidden;background:#eef2f7;border:1px solid var(--line);border-radius:12px;padding:22px}.stage-label{text-align:center;font-size:12px;color:var(--muted);margin-bottom:16px}.seat-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;width:100%;max-width:900px;margin:0 auto;min-width:0}.seat{aspect-ratio:1/0.78;min-width:0;border-radius:7px;border:1px solid #cbd5e1;background:white;display:grid;place-items:center;font-size:10px;font-weight:800;overflow:hidden}.seat.assigned{background:#dbeafe;border-color:#7dd3fc;color:#075985}.seat.conflict{background:#fee2e2;border-color:#fca5a5;color:#991b1b}.seat.empty{background:#f8fafc;color:#94a3b8}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:15px;font-size:11px;color:var(--muted)}.legend span{display:flex;gap:6px;align-items:center}.swatch{width:10px;height:10px;border-radius:3px}.settings-card{min-width:0;overflow:hidden}.settings-row{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.check{display:flex;align-items:center;gap:8px;font-size:12px}.check input{accent-color:var(--brand)}
.conflict-list{display:grid;gap:10px}.conflict{border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;justify-content:space-between;gap:14px;min-width:0}.conflict-main{min-width:0}.conflict h4{margin:0 0 4px;font-size:13px}.conflict p{margin:0;color:var(--muted);font-size:12px}.empty{padding:40px;text-align:center;color:var(--muted)}
.report-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.report-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.report-buttons .btn{justify-content:space-between}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:100}.modal{width:min(720px,92vw);max-height:88vh;overflow:auto;background:white;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal .card-head{position:sticky;top:0;background:white;z-index:1}.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:#0f172a;color:white;padding:12px 15px;border-radius:9px;display:none;max-width:min(420px,90vw);box-shadow:0 14px 35px rgba(0,0,0,.2)}.toast.show{display:block}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#dbeafe,transparent 30%),#f8fafc}.login-box{width:min(430px,92vw);background:white;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:var(--shadow)}.login-logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;margin-bottom:24px}.login-box h1{margin:0 0 6px}.login-box p{color:var(--muted);font-size:13px;margin:0 0 22px}.login-box .form-group{margin-bottom:14px}
.mobile-menu{display:none}
@media(max-width:1150px){
 .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
 .dashboard-grid,.dashboard-lower{grid-template-columns:1fr}
 .seat-layout{grid-template-columns:minmax(0,1fr) 290px}
 .sidebar{width:76px}.sidebar .brand span,.sidebar .nav button span,.sidebar .nav-section,.sidebar-bottom span{display:none}.sidebar .nav button{justify-content:center}.main{margin-left:76px}
}
@media(max-width:820px){
 .content{padding:16px}.topbar{padding:0 16px}.page-head{display:block}.actions{margin-top:12px}
 .stats{grid-template-columns:1fr 1fr}.wizard{grid-template-columns:1fr}.steps{display:flex;overflow-x:auto}.step{min-width:150px}
 .seat-layout{grid-template-columns:1fr}.seat-grid{grid-template-columns:repeat(8,minmax(24px,1fr));gap:6px}.room-stage{padding:14px}
 .report-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
 .stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}
 .seat-grid{grid-template-columns:repeat(4,minmax(35px,1fr));max-width:430px}.seat{aspect-ratio:1}.page-head h1{font-size:22px}
 .sidebar{width:64px}.main{margin-left:64px}.content{padding:12px}.topbar{height:58px}.topbar-left{font-size:13px}
 .table th,.table td{padding:9px;font-size:12px}.report-buttons{grid-template-columns:1fr}
}
</style>
</head>

function examRollRange(exam, index){
 const students=(app.data?.students||[]).filter(s=>s.roll).slice().sort((a,b)=>{
   const na=Number(String(a.roll).replace(/\D/g,""))||0, nb=Number(String(b.roll).replace(/\D/g,""))||0;
   return na-nb;
 });
 if(!students.length || !exam) return null;
 // Use the real university roll numbers from the CSDS Excel data.
 // The timetable rows are assigned contiguous ranges in timetable order.
 let start=0;
 const exams=app.data?.exams||[];
 for(let i=0;i<index;i++) start += Math.max(0, Number(exams[i]?.students)||0);
 if(start>=students.length) start = start % students.length;
 const count=Math.max(0, Number(exam.students)||0);
 const first=students[start];
 const last=students[Math.min(start+Math.max(1,count)-1,students.length-1)];
 if(!first || !last) return null;
 const shortRoll=(r)=>{
   const n=Number(String(r).replace(/\D/g,""));
   // University roll numbers in this dataset end in a sequential 4-digit serial.
   // Display that serial without leading zeroes, e.g. 25 to 44.
   const serial=String(r).match(/(\d{4})$/);
   return serial ? String(Number(serial[1])) : String(n);
 };
 return {from:shortRoll(first.roll),to:shortRoll(last.roll),fullFrom:first.roll,fullTo:last.roll,count:Math.min(count,students.length-start)};
}

function roomRollRange(room, assigned){
 const students=(app.data?.students||[]).filter(s=>s.roll).slice().sort((a,b)=>String(a.roll).localeCompare(String(b.roll),undefined,{numeric:true}));
 if(!assigned || !students.length) return null;
 const rooms=(app.data?.rooms||[]).filter(r=>r.status==="Available");
 const idx=Math.max(0,rooms.findIndex(r=>r.room===room));
 let start=0;
 for(let i=0;i<idx;i++){
   const prev=app.data.allocations?.[rooms[i].room];
   start += Math.min(prev?.assigned||0, students.length-start);
 }
 const first=students[Math.min(start,students.length-1)];
 const last=students[Math.min(start+assigned-1,students.length-1)];
 return first&&last?{from:first.roll,to:last.roll,count:Math.max(0,Math.min(assigned,students.length-start))}:null;
}

}

 try{for(const n of [...app.data.notifications]) await api("/api/notifications/"+encodeURIComponent(n.id),{method:"DELETE"});await loadData();toast("Notifications cleared");}
 catch(e){toast(e.message)}
}
function generateReport(name){
 const map={
  "Dashboard summary":{students:app.data.students.length,exams:app.data.exams.length,rooms:app.data.rooms.length,openConflicts:app.data.conflicts.filter(c=>c.status==="Open").length,faculty:app.data.faculty.length},
  "Timetable details":app.data.exams,
  "Room utilization":app.data.rooms,
  "Seat allocation":app.data.allocations,
  "Conflict statistics":app.data.conflicts,
  "Faculty workload":app.data.faculty,
  "Exam statistics":app.data.exams.map(e=>({id:e.id,subject:e.subject,date:e.date,students:e.students,status:e.status})),
  "Student participation":app.data.students
 };
 const payload={report:name,generatedAt:new Date().toISOString(),data:map[name]??app.data};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`examflow-${name.toLowerCase().replace(/[^a-z0-9]+/g,"-")}.json`;a.click();URL.revokeObjectURL(a.href);toast(`${name} exported`);
}
function exportData(kind){
 const data=kind==="all"?app.data:app.data[kind]; const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`examflow-${kind}.json`;a.click();URL.revokeObjectURL(a.href);toast("Export downloaded");
}
function exportCSV(){
 const rows=[["ID","Subject","Date","Time","Room","University Roll No.","Status"],...app.data.exams.map((e,i)=>{const rr=examRollRange(e,i);return [e.id,e.subject,e.date,e.time,e.room,rr?`${rr.from} to ${rr.to}`:"",e.status]})];
 const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="examflow-timetable.csv";a.click();toast("CSV downloaded");
}
function go(p){app.page=p;app.search="";render();}
async function logout(){try{await api("/api/logout",{method:"POST"})}catch{}localStorage.removeItem("examflow_token");app.token="";app.user=null;renderLogin();}
function render(){
 if(!app.user)return renderLogin();
 const view=app.page==="dashboard"?dashboard:app.page==="timetable"?timetable:app.page==="seats"?seats:app.page==="conflicts"?conflicts:app.page==="reports"?reports:app.page==="notifications"?notifications:config[app.page]?()=>dataPage(app.page):dashboard;
 document.getElementById("root").innerHTML=nav()+`<main class="main">${topbar()}<section class="content">${view()}</section></main>`;
}
function renderLogin(){
 document.getElementById("root").innerHTML=`<div class="login"><div class="login-box"><div class="login-logo"><div class="brand-mark">✦</div>ExamFlow</div><h1>Welcome back</h1><p>Sign in to manage timetables, rooms, seats, conflicts, and reports.</p><form id="login-form" onsubmit="login(event)"><div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" value="admin@college.edu" autocomplete="username" required></div><div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" value="demo123456" autocomplete="current-password" required></div><button type="submit" class="btn primary" style="width:100%;justify-content:center">Sign in</button><div id="login-error" style="color:#b42318;font-size:13px;margin-top:10px;min-height:18px;text-align:center"></div></form><div class="small" style="text-align:center;margin-top:16px">Demo: admin@college.edu / demo123456</div></div></div>`;
}
async function login(e){
 e.preventDefault();
 if(app.loginBusy)return;
 const button=e.submitter||e.target.querySelector("button[type=submit]");
 app.loginBusy=true;if(button){button.disabled=true;button.textContent="Signing in…";}
 try{
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const j=await api("/api/login",{method:"POST",body:JSON.stringify({email,password})});
  app.token=j.token;app.user=j.user;localStorage.setItem("examflow_token",app.token);
  if(app.localMode)localStorage.setItem("examflow_local_auth","1");
  await loadData();toast(app.localMode?"Signed in — local demo mode":"Welcome to ExamFlow");
 }catch(err){
  const box=document.getElementById("login-error");if(box)box.textContent=err.message||"Unable to sign in";
 }finally{app.loginBusy=false;if(button){button.disabled=false;button.textContent="Sign in";}}
}
async function loadData(){
 const j=await api("/api/bootstrap");app.user=j.user;app.data=j.data;
 const avail=app.data.rooms.find(r=>r.status==="Available"); if(avail && !app.data.allocations[app.room]) app.room=avail.room;
 render();
}
(async()=>{
 if(app.token){try{await loadData()}catch{localStorage.removeItem("examflow_token");app.token="";renderLogin()}}
 else renderLogin();
})();
</script>
